name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Expo health
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Resolve Expo config
        run: pnpm expo:config

      - name: Check Expo project health
        run: pnpm expo:doctor

      - name: Validate EAS workflows
        run: pnpm check:workflows

      - name: Export web app
        run: pnpm export:web

      - name: Audit dependencies
        run: pnpm audit:dependencies

  package-tests:
    name: Shared package tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Run generator tests
        run: pnpm test:scripts

      - name: Run shared package Jest suites with coverage
        run: pnpm test:coverage:packages

  app-tests:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Run app Jest suite with coverage
        run: pnpm test:coverage:app

  template-canary:
    name: Generated template canary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Verify a freshly initialized project
        run: pnpm verify:template

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose /repo
